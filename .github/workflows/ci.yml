# Keeps main green: every push and pull request runs `make check` on the portable lock.
# MLX-only code paths cannot run here; they are verified on the M4 (see AGENTS.md).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the portable lock
        run: |
          python -m pip install -r experiments/phase1/requirements-portable-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: make check
        run: make check PYTHON=python
